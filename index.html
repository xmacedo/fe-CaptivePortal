<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acesso Futuro Suave | Wi‑Fi</title>
    <link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
<main class="card">
    <header class="header">
        <div class="logo-wrap">
            <img src="./images/logo.png" alt="Logo da empresa" class="logo" />
        </div>
        <div>
            <p>Preencha seus dados para liberar o acesso de convidado.</p>
        </div>
    </header>

    <form id="guest-form" novalidate>
        <div class="grid">
            <div class="field full">
                <label for="fullName">Nome completo *</label>
                <input id="fullName" name="fullName" required maxlength="120" autocomplete="name" />
            </div>

            <div class="field">
                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" required maxlength="180" autocomplete="email" />
            </div>

            <div class="field">
                <label for="phone">Telefone</label>
                <input id="phone" name="phone" type="tel" required maxlength="30" autocomplete="tel" />
            </div>
        </div>

        <label class="consent" for="acceptedTerms">
            <input type="checkbox" id="acceptedTerms" name="acceptedTerms" required />
            <span>Declaro que li e aceito os termos de uso e política de privacidade. *</span>
        </label>

        <p class="hint">Os campos marcados com * são obrigatórios.</p>
        <p id="device-info" class="device-info" aria-live="polite"></p>

        <div class="actions">
            <button type="submit" id="submit-button">Liberar acesso</button>
            <div id="status" class="status" role="status" aria-live="polite"></div>
        </div>
    </form>
</main>

<script src="./assets/app.js"></script>
</body>
</html>
